<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeno Evolution v2</title>

<style>
body { margin:0; overflow:hidden; background:#00010a; }
#ui {
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-family:system-ui;
    z-index:10;
}
.bar {
    width:200px;
    height:10px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}
.fill {
    height:100%;
    width:0%;
    background:#22c55e;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="ui">
🧬 Biomasa: <span id="bio">0</span>
<div class="bar"><div id="bar" class="fill"></div></div>
</div>

<script>

// ======================
// SCÉNA
// ======================
const scene = new THREE.Scene();

// hviezdy (vizuál)
for(let i=0;i<200;i++){
    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.02,4,4),
        new THREE.MeshBasicMaterial({ color:0xffffff })
    );
    star.position.set(
        (Math.random()-0.5)*50,
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*20
    );
    scene.add(star);
}

// kamera
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 12;

// renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ======================
// PLAYER
// ======================
const player = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 16, 16),
    new THREE.MeshBasicMaterial({ color:0x38bdf8 })
);
scene.add(player);

// ======================
// INPUT (JOYSTICK STYLE)
// ======================
let inputX = 0;
let inputY = 0;

function setInput(clientX, clientY){
    inputX = (clientX / window.innerWidth) * 2 - 1;
    inputY = -(clientY / window.innerHeight) * 2 + 1;
}

window.addEventListener("touchmove",(e)=>{
    setInput(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener("mousemove",(e)=>{
    setInput(e.clientX, e.clientY);
});

// ======================
// ORBS
// ======================
const orbs = [];

function spawnOrb(){
    const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.15,10,10),
        new THREE.MeshBasicMaterial({ color:0x22c55e })
    );

    orb.position.set(
        (Math.random()-0.5)*25,
        (Math.random()-0.5)*18,
        0
    );

    scene.add(orb);
    orbs.push(orb);
}

for(let i=0;i<50;i++) spawnOrb();

// ======================
// GAME STATE
// ======================
let biomass = 0;

const bio = document.getElementById("bio");
const bar = document.getElementById("bar");

// ======================
// CAMERA FOLLOW (smooth)
// ======================
const camTarget = new THREE.Vector3();

// ======================
// LOOP
// ======================
function animate(){
    requestAnimationFrame(animate);

    // ======================
    // PLAYER MOVEMENT (FIXED)
    // ======================
    const speed = 0.15;

    player.position.x += inputX * speed;
    player.position.y += inputY * speed;

    // clamp (neujde mimo svet)
    player.position.x = Math.max(-10, Math.min(10, player.position.x));
    player.position.y = Math.max(-6, Math.min(6, player.position.y));

    // ======================
    // CAMERA SMOOTH FOLLOW
    // ======================
    camTarget.x = player.position.x * 0.6;
    camTarget.y = player.position.y * 0.6;

    camera.position.x += (camTarget.x - camera.position.x) * 0.05;
    camera.position.y += (camTarget.y - camera.position.y) * 0.05;

    camera.lookAt(player.position);

    // ======================
    // ORB COLLISION (STABLE)
    // ======================
    for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];

        const dx = player.position.x - o.position.x;
        const dy = player.position.y - o.position.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        // magnet
        if(dist < 3){
            o.position.x += dx * 0.02;
            o.position.y += dy * 0.02;
        }

        // pickup
        if(dist < 0.7){
            scene.remove(o);
            orbs.splice(i,1);

            biomass++;
            player.scale.multiplyScalar(1.02);

            spawnOrb();
        }
    }

    // UI
    bio.innerText = biomass;
    bar.style.width = Math.min(biomass*2,100) + "%";

    renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
