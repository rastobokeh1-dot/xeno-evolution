<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeno Evolution v3 CORE</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at center, #0b1020, #000);
}

#ui {
    position:fixed;
    top:12px;
    left:12px;
    color:white;
    font-family:system-ui;
    z-index:10;
    font-size:14px;
}

.bar {
    width:220px;
    height:10px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.fill {
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#38bdf8);
    transition: width 0.2s;
}

/* jemný blur glow efekt */
.orb-glow {
    box-shadow: 0 0 20px #22c55e;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="ui">
🧬 Biomasa: <span id="bio">0</span>
<div class="bar"><div id="bar" class="fill"></div></div>
</div>

<script>

// ======================
// SCÉNA
// ======================
const scene = new THREE.Scene();

// hviezdy (parallax + hĺbka)
for(let i=0;i<250;i++){
    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.02,4,4),
        new THREE.MeshBasicMaterial({ color:0xffffff })
    );

    star.position.set(
        (Math.random()-0.5)*60,
        (Math.random()-0.5)*40,
        (Math.random()-0.5)*30
    );

    scene.add(star);
}

// kamera
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 14;

// renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// svetlo (jemné)
scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
const light = new THREE.PointLight(0x88ccff, 1);
light.position.set(5,5,10);
scene.add(light);

// ======================
// PLAYER (lepší vizuál)
// ======================
const player = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 24, 24),
    new THREE.MeshStandardMaterial({
        color:0x38bdf8,
        emissive:0x0ea5e9,
        emissiveIntensity:0.4,
        roughness:0.3,
        metalness:0.2
    })
);
scene.add(player);

// ======================
// INPUT (smooth)
// ======================
let tx = 0;
let ty = 0;

function setInput(x,y){
    tx = (x / window.innerWidth) * 2 - 1;
    ty = -(y / window.innerHeight) * 2 + 1;
}

window.addEventListener("touchmove",e=>{
    setInput(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener("mousemove",e=>{
    setInput(e.clientX, e.clientY);
});

// ======================
// ORBS (glow energy)
// ======================
const orbs = [];

function spawnOrb(){
    const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.14,12,12),
        new THREE.MeshStandardMaterial({
            color:0x22c55e,
            emissive:0x22c55e,
            emissiveIntensity:1
        })
    );

    orb.position.set(
        (Math.random()-0.5)*30,
        (Math.random()-0.5)*20,
        0
    );

    scene.add(orb);
    orbs.push(orb);
}

for(let i=0;i<60;i++) spawnOrb();

// ======================
// GAME STATE
// ======================
let biomass = 0;

const bio = document.getElementById("bio");
const bar = document.getElementById("bar");

// ======================
// LOOP
// ======================
function animate(){
    requestAnimationFrame(animate);

    // PLAYER MOVE (váha + stabilita)
    player.position.x += (tx * 9 - player.position.x) * 0.06;
    player.position.y += (ty * 6 - player.position.y) * 0.06;

    // jemné dýchanie
    player.scale.setScalar(1 + Math.sin(Date.now()*0.003)*0.05);

    // CAMERA FOLLOW (smooth + cinematic)
    camera.position.x += (player.position.x - camera.position.x) * 0.04;
    camera.position.y += (player.position.y - camera.position.y) * 0.04;

    camera.lookAt(player.position);

    // ======================
    // ORBS SYSTEM (stable + glow feel)
    // ======================
    for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];

        const dx = player.position.x - o.position.x;
        const dy = player.position.y - o.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // jemný magnet
        if(dist < 3){
            o.position.x += dx * 0.01;
            o.position.y += dy * 0.01;
        }

        // pickup
        if(dist < 0.75){
            scene.remove(o);
            orbs.splice(i,1);

            biomass++;
            player.scale.multiplyScalar(1.02);

            spawnOrb();
        }
    }

    // UI
    bio.innerText = biomass;
    bar.style.width = Math.min(biomass*2,100) + "%";

    renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
