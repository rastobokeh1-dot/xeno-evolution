<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xeno-Evolúcia: Kvantová Singularita v5.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #010206; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        /* Vrstva pre fluidné metabally a vrstva pre ostré HUD prvky */
        #renderCanvas { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 1; }
        
        /* Špičkový Sci-Fi Sklenený Panel (HUD) */
        #macro-hud {
            position: absolute; top: env(safe-area-inset-top, 20px); left: 16px; right: 16px;
            background: linear-gradient(135deg, rgba(3, 8, 24, 0.9) 0%, rgba(1, 4, 12, 0.75) 100%);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding: 14px 22px; border-radius: 18px; border: 1px solid rgba(0, 255, 204, 0.25);
            display: none; justify-content: space-between; align-items: center; z-index: 10;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 0 15px rgba(0, 255, 204, 0.08);
        }
        .title-section { display: flex; flex-direction: column; gap: 3px; }
        #species-name { font-size: 15px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
        #rarity-badge { font-size: 9px; font-weight: 900; padding: 2px 8px; border-radius: 5px; letter-spacing: 1px; width: fit-content; text-transform: uppercase; background: rgba(0,255,204,0.1); color: #00ffcc; border: 1px solid rgba(0,255,204,0.3); }
        
        .stats-section { display: flex; gap: 20px; align-items: center; }
        .stat-capsule { display: flex; flex-direction: column; }
        .stat-label { font-size: 8px; color: #7f9bdf; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
        .stat-value { font-size: 17px; font-weight: 800; color: #fff; }

        /* Krebs-Matrix Syntetizátor */
        .matrix-grid { display: flex; gap: 6px; }
        .matrix-node { padding: 4px 9px; border-radius: 8px; font-weight: 800; font-size: 11px; border: 1px solid rgba(255,255,255,0.03); display: flex; gap: 3px; }
        
        /* Riadiaci Kokpit a Kvantový Navigátor */
        #cockpit-layout {
            position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 16px; right: 16px;
            display: flex; gap: 12px; z-index: 10; height: 90px; pointer-events: none;
        }
        #terminal-box {
            flex: 1.7; background: linear-gradient(180deg, rgba(2, 6, 18, 0.95) 0%, rgba(1, 2, 6, 0.88) 100%);
            backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); pointer-events: auto;
            border: 1px solid rgba(0, 255, 204, 0.3); padding: 12px 16px; border-radius: 18px;
            display: flex; flex-direction: column; justify-content: center; gap: 4px;
            box-shadow: 0 16px 45px rgba(0,0,0,0.9);
        }
        #terminal-header { font-size: 9px; color: #00ffcc; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; opacity: 0.8; display: flex; justify-content: space-between; }
        #terminal-text { color: #d6f5ff; font-size: 11.5px; line-height: 1.4; font-weight: 500; min-height: 34px; font-family: -apple-system, sans-serif; }
        
        #controls-box { flex: 1.3; display: flex; gap: 8px; pointer-events: auto; }
        .action-btn {
            flex: 1; background: rgba(4, 10, 26, 0.85); border: 1px solid rgba(0, 255, 204, 0.2);
            color: #00ffcc; border-radius: 16px; font-weight: 800; font-size: 9px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            cursor: pointer; opacity: 0.2; pointer-events: none; text-transform: uppercase;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .action-btn span:first-child { font-size: 18px; transition: transform 0.15s; }
        .action-btn:active span:first-child { transform: scale(1.25); }
        .action-btn.available { opacity: 1; pointer-events: auto; border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); }
        .action-btn.evolution-ready { opacity: 1; pointer-events: auto; border-color: #ff00ff; color: #ff00ff; background: rgba(255, 0, 255, 0.12); animation: macroGlow 1.4s infinite ease-in-out; }
        
        @keyframes macroGlow {
            0% { box-shadow: 0 0 5px rgba(255,0,255,0.2); transform: scale(1); }
            50% { box-shadow: 0 0 22px rgba(255,0,255,0.5); transform: scale(1.03); }
            100% { box-shadow: 0 0 5px rgba(255,0,255,0.2); transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="renderCanvas"></canvas>

    <div id="macro-hud">
        <div class="title-section">
            <span id="species-name">Eukaryota Protoxa</span>
            <span id="rarity-badge">Bežná DNA</span>
        </div>
        <div class="stats-section">
            <div class="stat-capsule">
                <span class="stat-label">Biomasa</span>
                <span id="val-score" class="stat-value">0</span>
            </div>
            <div class="stat-capsule">
                <span class="stat-label">Membrána</span>
                <span id="val-health" class="stat-value" style="color: #ff3b6b;">100%</span>
            </div>
            <div class="matrix-grid">
                <div class="matrix-node" style="background: rgba(255,59,107,0.07); color: #ff3b6b;"><span>H</span><span id="m-h">0</span></div>
                <div class="matrix-node" style="background: rgba(0,204,255,0.07); color: #00ccff;"><span>C</span><span id="m-c">0</span></div>
                <div class="matrix-node" style="background: rgba(124,255,26,0.07); color: #7cff1a;"><span>O</span><span id="m-o">0</span></div>
                <div class="matrix-node" style="background: rgba(191,85,236,0.07); color: #bf55ec;"><span>N</span><span id="m-n">0</span></div>
            </div>
        </div>
    </div>
    
    <div id="cockpit-layout">
        <div id="terminal-box">
            <div id="terminal-header">
                <span>Kvantový Navigátor v5.0 Modul</span>
                <span id="terminal-coords" style="font-family: monospace;">LOG.INIT</span>
            </div>
            <div id="terminal-text"></div>
        </div>
        <div id="controls-box">
            <button class="action-btn" id="action-chitin"><span>🛡️</span><span>Chitín</span></button>
            <button class="action-btn" id="action-atp"><span>⚡</span><span>ATP Dash</span></button>
            <button class="action-btn" id="action-evolve"><span>🧬</span><span>Evolúcia</span></button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');

    // --- DELTA TIME & SYSTEM ENGINE ---
    let lastTime = performance.now();
    let dt = 0;
    let shakeIntensity = 0;
    let globalPulse = 0;

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
    }

    // --- PROCEDURÁLNY SYNTHESIZER (Nulové externé audio súbory) ---
    let audioCtx = null;
    let masterBus = null;
    let droneOsc = null;

    function initBioAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-10, audioCtx.currentTime);
        limiter.knee.setValueAtTime(25, audioCtx.currentTime);
        limiter.ratio.setValueAtTime(15, audioCtx.currentTime);
        limiter.attack.setValueAtTime(0.004, audioCtx.currentTime);
        limiter.release.setValueAtTime(0.2, audioCtx.currentTime);
        
        masterBus = audioCtx.createGain();
        masterBus.gain.setValueAtTime(0.35, audioCtx.currentTime);

        masterBus.connect(limiter);
        limiter.connect(audioCtx.destination);

        // Hlboký oceanický sub-bass šum
        try {
            droneOsc = audioCtx.createOscillator();
            let droneGain = audioCtx.createGain();
            let lowpass = audioCtx.createBiquadFilter();

            droneOsc.type = 'sine';
            droneOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
            
            lowpass.type = 'lowpass';
            lowpass.frequency.setValueAtTime(90, audioCtx.currentTime);

            droneGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

            droneOsc.connect(lowpass);
            lowpass.connect(droneGain);
            droneGain.connect(masterBus);
            droneOsc.start();
        } catch(e) {}
    }

    function playSynthTone(freq, type, duration, volume = 0.15, sweepFreq = 0) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if(sweepFreq > 0) {
                osc.frequency.exponentialRampToValueAtTime(sweepFreq, audioCtx.currentTime + duration);
            }

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(masterBus);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    // --- MODEL PLANÉTY A SCÉNY ---
    let currentStage = 'ORBIT'; // ORBIT -> COLLISION -> SEEDING -> MICRO
    let score = 0;
    let fadeAlpha = 0;
    let celestialBody = { x: window.innerWidth / 2, y: window.innerHeight / 2 - 50, r: 70 };
    let seedAsteroid = { x: -40, y: -40, speed: 6.5 };

    const rawElements = [
        { type: 'H', color: '#ff3b6b', freq: 261.63 }, 
        { type: 'C', color: '#00ccff', freq: 329.63 }, 
        { type: 'O', color: '#7cff1a', freq: 392.00 }, 
        { type: 'N', color: '#bf55ec', freq: 523.25 }
    ];

    let itemsPool = [], entitiesPool = [], visualParticles = [], popupsPool = [];

    // --- ENERGETICKÁ BIOMECHANIKA HRÁČA (Verlet Model) ---
    class VerletSegment {
        constructor(x, y, len) {
            this.x = x; this.y = y;
            this.oldX = x; this.oldY = y;
            this.len = len;
        }
        update(parentX, parentY, viscosity) {
            let vx = (this.x - this.oldX) * (1 - viscosity * dt);
            let vy = (this.y - this.oldY) * (1 - viscosity * dt);
            this.oldX = this.x; this.oldY = this.y;
            this.x += vx; this.y += vy;

            let dx = parentX - this.x;
            let dy = parentY - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > this.len) {
                let ratio = this.len / dist;
                this.x = parentX - dx * ratio;
                this.y = parentY - dy * ratio;
            }
        }
    }

    let player = {
        x: window.innerWidth/2, y: window.innerHeight/2, r: 16,
        targetX: window.innerWidth/2, targetY: window.innerHeight/2,
        vx: 0, vy: 0, accel: 0.07, friction: 0.86, health: 100,
        stats: { H: 0, C: 0, O: 0, N: 0 },
        compounds: { chitin: false, atpDash: 0 },
        tier: 1, segments: []
    };

    // Inicializácia Verletovho bio-chvosta
    for(let i=0; i<8; i++) {
        player.segments.push(new VerletSegment(player.x, player.y, 10));
    }

    // --- KVANTOVÝ TERMINÁL TEXT STREAMING ---
    let streamedText = "";
    let targetText = "DETEGOVANÁ LOKÁCIA: Orbitálna zóna neznámej biosféry. Dotykom nasmeruj genetický nosič (asteroid) na impaktné súradnice jadra.";
    let charPos = 0;
    let updateTick = 0;

    function setTerminal(msg) {
        targetText = msg; streamedText = ""; charPos = 0;
    }

    function runTerminalStream() {
        updateTick++;
        if (updateTick % 2 === 0 && charPos < targetText.length) {
            streamedText += targetText.charAt(charPos);
            charPos++;
            document.getElementById('terminal-text').innerText = streamedText;
        }
    }
    setTerminal(targetText);

    // --- INTERFACEOVÉ VSTUPY A AKTIVÁCIE ---
    window.addEventListener('touchstart', (e) => {
        initBioAudio();
        if (currentStage === 'SEEDING') {
            playSynthTone(110, 'sine', 0.6, 0.4, 330);
            currentStage = 'ATMOSPHERE_ZOOM';
            setTerminal("SND.KONTROLA: Zostupujeme cez mezosféru. Extrémna ionizácia plynov. Aktivujem mikroskopické senzory DNA.");
        }
        if (currentStage === 'MICRO' && player.health > 0) {
            player.targetX = e.touches[0].clientX;
            player.targetY = e.touches[0].clientY;
        }
    });

    window.addEventListener('touchmove', (e) => {
        if (currentStage === 'MICRO' && player.health > 0) {
            e.preventDefault();
            player.targetX = e.touches[0].clientX;
            player.targetY = e.touches[0].clientY;
        }
    }, { passive: false });

    // --- KREBS-MATRIX SYNTÉZA (Crafting a Mechaniky) ---
    document.getElementById('action-chitin').addEventListener('click', (e) => {
        e.stopPropagation();
        if (player.stats.C >= 5 && player.stats.H >= 3 && !player.compounds.chitin) {
            player.stats.C -= 5; player.stats.H -= 3;
            player.compounds.chitin = true;
            playSynthTone(440, 'triangle', 0.4, 0.3, 220);
            createBlast(player.x, player.y, '#00ccff', 25);
            setTerminal("SYNTÉZA ÚSPEŠNÁ: Polymerizácia exokostry dokončená. Pasívny absorpčný štít znižuje poškodenie o 50%.");
            refreshHUD();
        }
    });

    document.getElementById('action-atp').addEventListener('click', (e) => {
        e.stopPropagation();
        if (player.stats.N >= 4 && player.stats.O >= 2) {
            player.stats.N -= 4; player.stats.O -= 2;
            player.compounds.atpDash = 140; // Trvanie zrýchlenia naviazané na engine
            playSynthTone(587.33, 'sine', 0.25, 0.3, 880);
            setTerminal("BIOMOTORICKÝ IMPULZ: Adenozíntrifosfát (ATP) zaplavil bunkové steny. Hydrodynamická rýchlosť zvýšená o 100%.");
            refreshHUD();
        }
    });

    document.getElementById('action-evolve').addEventListener('click', (e) => {
        e.stopPropagation();
        if (score >= 250 && player.tier === 1) {
            player.tier = 2; player.r = 22;
            executeEvolutionBlast(350);
            setTerminal("MUTÁCIA TIER II: Prechod na poly-bunkový syncytium. Zadné Verletovo tkanivo predĺžené.");
            // Predĺženie chvosta pre pokročilú hydrodynamiku
            for(let i=0; i<6; i++) player.segments.push(new VerletSegment(player.x, player.y, 8));
            refreshHUD();
        } else if (score >= 700 && player.tier === 2) {
            player.tier = 3; player.r = 28;
            executeEvolutionBlast(500);
            
            // Určenie evolučnej rarity (Xeno-Evolučná Divergencia)
            const roll = Math.random();
            const badge = document.getElementById('rarity-badge');
            const nameEl = document.getElementById('species-name');
            
            if (roll < 0.55) {
                player.rarity = { label: "Vzácny Biomorf", color: "#00ffcc", name: "Xeno-Scyphozoa" };
            } else if (roll < 0.88) {
                player.rarity = { label: "Ultra Hybrid", color: "#bf55ec", name: "Kvantový Kormidelník" };
                shakeIntensity = 15;
            } else {
                player.rarity = { label: "XENO-SINGULARITA", color: "#ff3b6b", name: "Apex Protocell Alpha" };
                shakeIntensity = 30;
            }

            badge.innerText = player.rarity.label;
            badge.style.color = player.rarity.color;
            badge.style.borderColor = player.rarity.color;
            badge.style.background = player.rarity.color + "15";
            nameEl.innerText = player.rarity.name;

            setTerminal(`GENETICKÁ SINGULARITA KRACHLA: Tvoja bunka zmutovala na [${player.rarity.label}] - ${player.rarity.name}.`);
            refreshHUD();
        }
    });

    function executeEvolutionBlast(baseFreq) {
        playSynthTone(baseFreq, 'sine', 0.7, 0.3);
        playSynthTone(baseFreq * 1.33, 'sine', 0.7, 0.2);
        createBlast(player.x, player.y, '#ff00ff', 45);
        shakeIntensity = 18;
    }

    function createBlast(x, y, color, count) {
        for(let i=0; i<count; i++) {
            visualParticles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                r: Math.random()*3+1, color: color, alpha: 1, decay: Math.random()*0.02 + 0.015
            });
        }
    }

    function addPopup(x, y, msg, color) {
        popupsPool.push({ x: x, y: y, text: msg, color: color, alpha: 1, vy: -0.9 });
    }

    function spawnElementNode() {
        let nodeType = rawElements[Math.floor(Math.random()*rawElements.length)];
        itemsPool.push({
            x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
            r: 5, angle: Math.random()*Math.PI*2, speed: Math.random()*0.5 + 0.2,
            pulseOffset: Math.random()*10, ...nodeType
        });
    }

    function spawnParasiteEntity() {
        const archetypes = [
            { type: 'BOID_SWARMER', color: '#ff3b6b', r: 8, speed: 1.2 },
            { type: 'PREDICTIVE_STALKER', color: '#bf55ec', r: 11, speed: 1.7 },
            { type: 'MACRO_DEVOURER', color: '#ffaa00', r: 19, speed: 0.5 }
        ];
        let pick = archetypes[Math.floor(Math.random()*archetypes.length)];
        entitiesPool.push({
            x: Math.random() > 0.5 ? -30 : window.innerWidth + 30,
            y: Math.random() * window.innerHeight,
            vx: 0, vy: 0, pulseOffset: Math.random()*5, ...pick
        });
    }

    function refreshHUD() {
        document.getElementById('m-h').innerText = player.stats.H;
        document.getElementById('m-c').innerText = player.stats.C;
        document.getElementById('m-o').innerText = player.stats.O;
        document.getElementById('m-n').innerText = player.stats.N;
        document.getElementById('val-score').innerText = score;
        document.getElementById('val-health').innerText = Math.floor(player.health) + "%";

        const btnChitin = document.getElementById('action-chitin');
        const btnAtp = document.getElementById('action-atp');
        const btnEvolve = document.getElementById('action-evolve');

        if (player.stats.C >= 5 && player.stats.H >= 3 && !player.compounds.chitin) btnChitin.classList.add('available'); else btnChitin.classList.remove('available');
        if (player.stats.N >= 4 && player.stats.O >= 2) btnAtp.classList.add('available'); else btnAtp.classList.remove('available');

        if ((score >= 250 && player.tier === 1) || (score >= 700 && player.tier === 2)) {
            btnEvolve.classList.add('evolution-ready');
        } else {
            btnEvolve.classList.remove('evolution-ready');
        }
    }

    // --- ENERGETICKÁ EMERGENTNÁ AI LOGIKA (Kontrola rytmu ekosystému) ---
    let aiClock = 0;
    function runEcosystemAI() {
        if (currentStage !== 'MICRO' || player.health <= 0) return;

        // Dosiahnutie Biologickej Singularity (Finále simulácie)
        if (score >= 1300 && player.tier === 3) {
            player.tier = 4;
            document.getElementById('terminal-header').innerText = "Vedomie Planéty HAPLOID • KONEČNÝ STAV";
            setTerminal("ABSORPCIA UKONČENÁ: Tvoj biomorf sa integroval do globálnej neurónovej biosiete oceánu. Ovládol si evolučný vektor celého ekosystému.");
            playSynthTone(523, 'sine', 1.5, 0.4);
            return;
        }

        if (player.tier === 4) return;

        if (player.health < 40) {
            playSynthTone(90, 'sawtooth', 0.25, 0.2);
            setTerminal("ALARM KOROGÁCIE: Proteínová membrána kolabuje pod náporom parazitických boidov. Absorbuj Vodík (H) pre reparáciu stien.");
        } else if (player.compounds.atpDash > 0) {
            setTerminal("METABOLICKÝ MONITOR: ATP katalyzátor vyvoláva hyper-sekréciu bičíkov. Úniková rýchlosť optimálna.");
        } else {
            const analyticalLogs = [
                "SKENER: Detegovaný rojový útok typu Swarmer. Využívajú kolektívne vektorové zarovnanie (Boids).",
                "ANALÝZA: Typ Stalker predpovedá trajektóriu tvojho sklzu. Meň smer nečakane.",
                "SKENER: Syntetizuj Chitínový pancier 🛡️ na trvalú ochranu pred absorpciou biomasy parazitmi."
            ];
            setTerminal(analyticalLogs[Math.floor(Math.random()*analyticalLogs.length)]);
        }
    }

    // --- ARCHITEKTÚRA ENGINE-U (Fyzikálne výpočty s Delta Time) ---
    function updateCoreEngine(now) {
        dt = (now - lastTime) / 16.666;
        if(dt > 4) dt = 4; // Bezpečnostný strop pri prepnutí taby na iPhone
        lastTime = now;

        runTerminalStream();

        if (shakeIntensity > 0) shakeIntensity -= 0.6 * dt;

        // FÁZA 1: Navigácia asteroidu na obežnej dráhe
        if (currentStage === 'ORBIT') {
            let angle = Math.atan2(celestialBody.y - seedAsteroid.y, celestialBody.x - seedAsteroid.x);
            seedAsteroid.vx = Math.cos(angle) * seedAsteroid.speed;
            seedAsteroid.vy = Math.sin(angle) * seedAsteroid.speed;
            currentStage = 'COLLISION_FLIGHT';
        }

        if (currentStage === 'COLLISION_FLIGHT') {
            seedAsteroid.x += seedAsteroid.vx * dt;
            seedAsteroid.y += seedAsteroid.vy * dt;
            let distance = Math.sqrt((seedAsteroid.x - celestialBody.x)**2 + (seedAsteroid.y - celestialBody.y)**2);
            if (distance < 12) {
                currentStage = 'EXPLOSION_IMPACT'; fadeAlpha = 1; shakeIntensity = 24;
                playSynthTone(50, 'sine', 1.5, 0.6, 20);
                createBlast(seedAsteroid.x, seedAsteroid.y, '#00ccff', 50);
                setTimeout(() => {
                    currentStage = 'SEEDING';
                    document.getElementById('terminal-coords').innerText = `LOC: PROT-99X`;
                    setTerminal("IMPAKTÚRA DOKONČENÁ: Nukleová DNA úspešne prenikla do kvapalného jadra planéty. Inicializuj zostup kliknutím.");
                }, 1100);
            }
        }

        if (currentStage === 'EXPLOSION_IMPACT' && fadeAlpha > 0) fadeAlpha -= 0.02 * dt;

        if (currentStage === 'ATMOSPHERE_ZOOM') {
            celestialBody.r += (window.innerWidth * 1.8 - celestialBody.r) * 0.04 * dt;
            if (celestialBody.r > window.innerWidth * 1.4) {
                currentStage = 'MICRO';
                document.getElementById('macro-hud').style.display = 'flex';
                player.x = window.innerWidth/2; player.y = window.innerHeight/2;
                player.targetX = player.x; player.targetY = player.y;
                for(let i=0; i<25; i++) spawnElementNode();
                for(let i=0; i<5; i++) spawnParasiteEntity();
                refreshHUD();
            }
        }

        // FÁZA 2: Mikroskopický život a boj
        if (currentStage === 'MICRO') {
            if (player.health <= 0) return;

            // Výpočet zrýchlenia vzhľadom na aktívne ATP molekuly
            let currentAccel = player.accel;
            if (player.compounds.atpDash > 0) {
                player.compounds.atpDash -= 1 * dt;
                currentAccel *= 2.1;
                if (Math.random() > 0.4) {
                    visualParticles.push({
                        x: player.x, y: player.y,
                        vx: -player.vx * 0.4, vy: -player.vy * 0.4, r: Math.random()*2+1, color: '#bf55ec', alpha: 0.9, decay: 0.06
                    });
                }
            }

            let ax = (player.targetX - player.x) * currentAccel;
            let ay = (player.targetY - player.y) * currentAccel;
            player.vx = (player.vx + ax) * Math.pow(player.friction, dt);
            player.vy = (player.vy + ay) * Math.pow(player.friction, dt);
            player.x += player.vx * dt;
            player.y += player.vy * dt;

            // Výpočet Verletovej kinematiky bio-chvosta s viskozitou kvapaliny
            let leaderX = player.x;
            let leaderY = player.y;
            player.segments.forEach(seg => {
                seg.update(leaderX, leaderY, 0.06);
                leaderX = seg.x;
                leaderY = seg.y;
            });

            // Aktualizácia elementárnych stavebných prvkov
            itemsPool.forEach(node => {
                node.x += Math.cos(node.angle) * node.speed * dt;
                node.y += Math.sin(node.angle) * node.speed * dt;
                if (node.x < 0 || node.x > window.innerWidth) node.angle = Math.PI - node.angle;
                if (node.y < 0 || node.y > window.innerHeight) node.angle = -node.angle;

                let distToPlayer = Math.sqrt((node.x - player.x)**2 + (node.y - player.y)**2);
                if (distToPlayer < player.r + node.r) {
                    player.stats[node.type]++;
                    playSynthTone(node.freq, 'sine', 0.08, 0.18);
                    score += 15;
                    addPopup(node.x, node.y, `+1 ${node.type}`, node.color);

                    if (player.health < 100) player.health = Math.min(100, player.health + 2);

                    itemsPool.splice(itemsPool.indexOf(node), 1);
                    refreshHUD();
                    spawnElementNode();
                }
            });

            // Komplexná Craig Reynolds Boids & Prediktívna Umelá Inteligencia parazitov
            entitiesPool.forEach((enemy, index) => {
                let dx = player.x - enemy.x;
                let dy = player.y - enemy.y;
                let distToPlayer = Math.sqrt(dx*dx + dy*dy);

                if (enemy.type === 'BOID_SWARMER') {
                    // Flocking sily: Separácia a Kohézia s ostatnými členmi roja
                    let separationX = 0, separationY = 0;
                    let flockCenterX = 0, flockCenterY = 0;
                    let totalInFlock = 0;

                    entitiesPool.forEach(other => {
                        if (other !== enemy && other.type === 'BOID_SWARMER') {
                            let sDist = Math.sqrt((other.x - enemy.x)**2 + (other.y - enemy.y)**2);
                            if (sDist < 50) {
                                separationX += enemy.x - other.x;
                                separationY += enemy.y - other.y;
                                flockCenterX += other.x;
                                flockCenterY += other.y;
                                totalInFlock++;
                            }
                        }
                    });

                    let targetVX = dx / distToPlayer;
                    let targetVY = dy / distToPlayer;

                    if (totalInFlock > 0) {
                        flockCenterX /= totalInFlock; flockCenterY /= totalInFlock;
                        targetVX += (flockCenterX - enemy.x) * 0.02 + separationX * 0.08;
                        targetVY += (flockCenterY - enemy.y) * 0.02 + separationY * 0.08;
                    }

                    enemy.x += targetVX * enemy.speed * dt;
                    enemy.y += targetVY * enemy.speed * dt;

                } else if (enemy.type === 'PREDICTIVE_STALKER') {
                    // Prediktívne nadbiehanie na základe momentálneho vektora rýchlosti améby
                    let leadTime = distToPlayer / 10;
                    let predictedPlayerX = player.x + player.vx * leadTime;
                    let predictedPlayerY = player.y + player.vy * leadTime;
                    
                    let pdx = predictedPlayerX - enemy.x;
                    let pdy = predictedPlayerY - enemy.y;
                    let pDist = Math.sqrt(pdx*pdx + pdy*pdy);

                    enemy.x += (pdx / pDist) * enemy.speed * dt;
                    enemy.y += (pdy / pDist) * enemy.speed * dt;

                } else if (enemy.type === 'MACRO_DEVOURER') {
                    // Tupý masívny útok priamo na cieľ
                    enemy.x += (dx / distToPlayer) * enemy.speed * dt;
                    enemy.y += (dy / distToPlayer) * enemy.speed * dt;
                }

                // Vyhodnotenie poškodenia alebo zničenia parazita
                if (distToPlayer < player.r + enemy.r) {
                    let dmgFactor = player.compounds.chitin ? 0.22 : 0.45;
                    if (enemy.type === 'MACRO_DEVOURER') dmgFactor *= 2.5;

                    player.health -= dmgFactor * dt;
                    shakeIntensity = 5;
                    playSynthTone(70, 'sawtooth', 0.05, 0.15);

                    if (player.health <= 0) {
                        player.health = 0;
                        playSynthTone(40, 'sawtooth', 1.2, 0.5);
                        setTerminal("GENETICKÉ ZLYHANIE: Bunkové jadro podľahlo degradácii biomateriálu. Obnov stránku pre rekonštrukciu DNA kódov.");
                    }
                    refreshHUD();
                }
            });

            aiClock++;
            if (aiClock % 60 === 0) runEcosystemAI();
        }

        // Čistenie a spracovanie výbuchov a vyskakovacích textov
        for(let i=visualParticles.length-1; i>=0; i--) {
            visualParticles[i].x += visualParticles[i].vx * dt;
            visualParticles[i].y += visualParticles[i].vy * dt;
            visualParticles[i].alpha -= visualParticles[i].decay * dt;
            if (visualParticles[i].alpha <= 0) visualParticles.splice(i, 1);
        }

        for(let i=popupsPool.length-1; i>=0; i--) {
            popupsPool[i].y += popupsPool[i].vy * dt;
            popupsPool[i].alpha -= 0.02 * dt;
            if (popupsPool[i].alpha <= 0) popupsPool.splice(i, 1);
        }
    }

    // --- HARDVÉROVO ACCELEROVANÝ KRESLIACI SYSTÉM (Bioluminiscencia) ---
    function executeRenderEngine() {
        ctx.save();
        
        // Aplikácia dynamických otrasov obrazovky
        if (shakeIntensity > 0) {
            let sx = (Math.random() - 0.5) * shakeIntensity;
            let sy = (Math.random() - 0.5) * shakeIntensity;
            ctx.translate(sx, sy);
        }

        // Simulácia chromatického rozostrenia hlbokého oceánu
        if (currentStage === 'MICRO') {
            ctx.fillStyle = 'rgba(1, 2, 7, 0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#010206';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Render makro planéty a vesmírneho preletu
        if (currentStage === 'COLLISION_FLIGHT' || currentStage === 'EXPLOSION_IMPACT' || currentStage === 'SEEDING' || currentStage === 'ATMOSPHERE_ZOOM') {
            ctx.save();
            let atmGlow = ctx.createRadialGradient(celestialBody.x, celestialBody.y, celestialBody.r*0.6, celestialBody.x, celestialBody.y, celestialBody.r*1.3);
            atmGlow.addColorStop(0, '#00ccff');
            atmGlow.addColorStop(0.6, '#bf55ec');
            atmGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = atmGlow;
            ctx.beginPath(); ctx.arc(celestialBody.x, celestialBody.y, celestialBody.r*1.3, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.save();
            let coreGrad = ctx.createRadialGradient(celestialBody.x - celestialBody.r*0.2, celestialBody.y - celestialBody.r*0.2, celestialBody.r*0.1, celestialBody.x, celestialBody.y, celestialBody.r);
            coreGrad.addColorStop(0, '#ffffff');
            coreGrad.addColorStop(0.4, '#00ccff');
            coreGrad.addColorStop(1, '#010206');
            ctx.fillStyle = coreGrad;
            ctx.beginPath(); ctx.arc(celestialBody.x, celestialBody.y, celestialBody.r, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        if (currentStage === 'COLLISION_FLIGHT') {
            ctx.fillStyle = '#ff3b6b';
            ctx.beginPath(); ctx.arc(seedAsteroid.x, seedAsteroid.y, 7, 0, Math.PI*2); ctx.fill();
        }

        // Render particle systému explózií
        visualParticles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        });

        // UKAZOVATEĽ MIKROSKOPICKÉHO SVETA
        if (currentStage === 'MICRO' && player.health > 0) {
            globalPulse += 0.06 * dt;

            // Kreslenie elementárnych prvkov pomocou hardvérového screenshader spojenia
            itemsPool.forEach(node => {
                let pR = node.r + Math.sin(globalPulse + node.pulseOffset) * 1.5;
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                let rad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, pR * 2);
                rad.addColorStop(0, node.color);
                rad.addColorStop(0.5, node.color + '33');
                rad.addColorStop(1, 'transparent');
                ctx.fillStyle = rad;
                ctx.beginPath(); ctx.arc(node.x, node.y, pR * 2, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });

            // Kreslenie biologických parazitov (AI Jednotiek)
            entitiesPool.forEach(enemy => {
                let ePulse = enemy.r + Math.sin(globalPulse + enemy.pulseOffset) * 1.3;
                ctx.save();
                let eGrad = ctx.createRadialGradient(enemy.x, enemy.y, ePulse*0.1, enemy.x, enemy.y, ePulse*1.2);
                if (enemy.type === 'PREDICTIVE_STALKER') {
                    eGrad.addColorStop(0, '#fff'); eGrad.addColorStop(0.6, '#bf55ec');
                } else if (enemy.type === 'MACRO_DEVOURER') {
                    eGrad.addColorStop(0, '#331100'); eGrad.addColorStop(0.7, '#ffaa00');
                } else {
                    eGrad.addColorStop(0, '#ff3b6b'); eGrad.addColorStop(0.7, '#660022');
                }
                eGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = eGrad;
                ctx.beginPath(); ctx.arc(enemy.x, enemy.y, ePulse * 1.2, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });

            // IMPLEMENTÁCIA PREPOJENIA FILTRA PRE METABALLS (Tekuté zlievanie tkanív)
            // Použitie canvas filtra pre dokonale čisté zliatie článkov chvosta s telom
            ctx.save();
            ctx.filter = 'blur(6px) contrast(14)'; // Natívny GPU prahový filter pre fluidný vzhľad

            let activeColor = player.tier === 3 ? player.rarity.color : '#00ffcc';

            ctx.fillStyle = activeColor;

            // Kreslenie článkov Verletovho chvosta vo vnútri filtra
            player.segments.forEach((seg, i) => {
                let segR = player.r * (1 - (i * 0.08));
                if (segR < 3) segR = 3;
                ctx.beginPath(); ctx.arc(seg.x, seg.y, segR, 0, Math.PI*2); ctx.fill();
            });

            // Hlavné jadro Améby s membránovou vlnovou osciláciou
            ctx.beginPath();
            let nodes = 16;
            for (let i = 0; i < nodes; i++) {
                let a = (i / nodes) * Math.PI * 2;
                let deform = Math.sin(globalPulse * 1.5 + i * 2) * 2;
                let cr = player.r + deform;
                let px = player.x + Math.cos(a) * cr;
                let py = player.y + Math.sin(a) * cr;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore(); // Ukončenie filtra metaballov, aby HUD ostal ostrý

            // Nadstavbové grafické efekty (Chitínový neónový pancier)
            if (player.compounds.chitin) {
                ctx.save();
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#00ccff';
                ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 4, 0, Math.PI*2); ctx.stroke();
                ctx.restore();
            }
        }

        // Renderovanie textových ASMR popapov
        popupsPool.forEach(t => {
            ctx.save();
            ctx.globalAlpha = t.alpha;
            ctx.fillStyle = t.color;
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(t.text, t.x, t.y);
            ctx.restore();
        });

        if (fadeAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${fadeAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.restore();
    }

    // --- MAIN ENGINE MATRIX LOOP ---
    function mainEngineLoop(now) {
        updateCoreEngine(now);
        executeRenderEngine();
        requestAnimationFrame(mainEngineLoop);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(mainEngineLoop);
</script>
