<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeno Evolution FIX v2.1</title>

<style>
body { margin:0; overflow:hidden; background:#00040f; }
#ui {
    position:fixed;
    top:12px;
    left:12px;
    color:white;
    font-family:system-ui;
    z-index:10;
}
.bar {
    width:200px;
    height:10px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}
.fill {
    height:100%;
    width:0%;
    background:#22c55e;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="ui">
🧬 Biomasa: <span id="bio">0</span>
<div class="bar"><div id="bar" class="fill"></div></div>
</div>

<script>

// =====================
// WORLD
// =====================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,0,12);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// =====================
// PLAYER
// =====================
const player = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 16, 16),
    new THREE.MeshBasicMaterial({ color:0x38bdf8 })
);
scene.add(player);

// =====================
// INPUT (RELATIVE CONTROL)
// =====================
let inputX = 0;
let inputY = 0;

function setInput(x,y){
    inputX = (x / window.innerWidth) * 2 - 1;
    inputY = -(y / window.innerHeight) * 2 + 1;
}

window.addEventListener("touchmove", e=>{
    setInput(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener("mousemove", e=>{
    setInput(e.clientX, e.clientY);
});

// =====================
// ORBS
// =====================
const orbs = [];

function spawnOrb(){
    const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.15,10,10),
        new THREE.MeshBasicMaterial({ color:0x22c55e })
    );

    orb.position.set(
        (Math.random()-0.5)*25,
        (Math.random()-0.5)*15,
        0
    );

    scene.add(orb);
    orbs.push(orb);
}

for(let i=0;i<50;i++) spawnOrb();

// =====================
// GAME STATE
// =====================
let biomass = 0;

const bio = document.getElementById("bio");
const bar = document.getElementById("bar");

// =====================
// LOOP
// =====================
function animate(){
    requestAnimationFrame(animate);

    // =====================
    // PLAYER MOVEMENT
    // =====================
    player.position.x += inputX * 0.15;
    player.position.y += inputY * 0.15;

    // limit sveta
    player.position.x = Math.max(-12, Math.min(12, player.position.x));
    player.position.y = Math.max(-8, Math.min(8, player.position.y));

    // =====================
    // CAMERA FOLLOW (FIX CORE BUG)
    // =====================
    camera.position.x += (player.position.x - camera.position.x) * 0.08;
    camera.position.y += (player.position.y - camera.position.y) * 0.08;

    camera.lookAt(player.position);

    // =====================
    // ORBS
    // =====================
    for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];

        const dx = player.position.x - o.position.x;
        const dy = player.position.y - o.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 0.8){
            scene.remove(o);
            orbs.splice(i,1);

            biomass++;
            player.scale.multiplyScalar(1.02);

            spawnOrb();
        }
    }

    // UI
    bio.innerText = biomass;
    bar.style.width = Math.min(biomass*2,100) + "%";

    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
