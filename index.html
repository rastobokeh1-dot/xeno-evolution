<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeno Evolution v4 LIVING CONTROL</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at center, #050817, #000);
}

#ui {
    position:fixed;
    top:12px;
    left:12px;
    color:white;
    font-family:system-ui;
    z-index:10;
}

.bar {
    width:220px;
    height:10px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

.fill {
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#38bdf8);
    transition: width 0.15s;
}

.pulse {
    animation: pulse 0.25s ease;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="ui">
🧬 Biomasa: <span id="bio">0</span>
<div class="bar"><div id="bar" class="fill"></div></div>
</div>

<script>

// ======================
// WORLD
// ======================
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x00040f, 5, 60);

// hviezdy
for(let i=0;i<250;i++){
    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.02,4,4),
        new THREE.MeshBasicMaterial({ color:0xffffff })
    );
    star.position.set(
        (Math.random()-0.5)*70,
        (Math.random()-0.5)*40,
        (Math.random()-0.5)*30
    );
    scene.add(star);
}

// kamera
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,0,16);

// renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// svetlo
scene.add(new THREE.AmbientLight(0x8899aa, 0.7));
const light = new THREE.PointLight(0x66ccff, 1.2);
light.position.set(5,5,10);
scene.add(light);

// ======================
// PLAYER (živý objekt)
// ======================
const player = new THREE.Mesh(
    new THREE.SphereGeometry(1, 28, 28),
    new THREE.MeshStandardMaterial({
        color:0x38bdf8,
        emissive:0x0ea5e9,
        emissiveIntensity:0.6,
        roughness:0.25
    })
);
scene.add(player);

// fyzika (INERCIA)
let velocity = new THREE.Vector3();

// ======================
// TOUCH CONTROL (gravitačný štýl)
// ======================
let target = new THREE.Vector3();

function setInput(x,y){
    target.x = (x / window.innerWidth) * 2 - 1;
    target.y = -(y / window.innerHeight) * 2 + 1;
}

window.addEventListener("touchmove",e=>{
    setInput(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener("mousemove",e=>{
    setInput(e.clientX, e.clientY);
});

// ======================
// ORBS
// ======================
const orbs = [];

function spawnOrb(){
    const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.14,14,14),
        new THREE.MeshStandardMaterial({
            color:0x22c55e,
            emissive:0x22c55e,
            emissiveIntensity:1
        })
    );

    orb.position.set(
        (Math.random()-0.5)*35,
        (Math.random()-0.5)*22,
        0
    );

    scene.add(orb);
    orbs.push(orb);
}

for(let i=0;i<70;i++) spawnOrb();

// ======================
// GAME STATE
// ======================
let biomass = 0;

const bio = document.getElementById("bio");
const bar = document.getElementById("bar");

// ======================
// LOOP
// ======================
function animate(){
    requestAnimationFrame(animate);

    // ======================
    // LIVING MOVEMENT SYSTEM
    // ======================

    // smer = “gravitačná sila”
    let force = new THREE.Vector3(
        target.x * 10 - player.position.x,
        target.y * 7 - player.position.y,
        0
    );

    velocity.add(force.multiplyScalar(0.02));
    velocity.multiplyScalar(0.88); // friction

    player.position.add(velocity);

    // jemné pulzovanie života
    player.scale.setScalar(1 + Math.sin(Date.now()*0.004)*0.05);

    // ======================
    // CAMERA DRIFT (cinematic feel)
    // ======================
    camera.position.x += (player.position.x - camera.position.x) * 0.03;
    camera.position.y += (player.position.y - camera.position.y) * 0.03;
    camera.position.z = 16 + Math.sin(Date.now()*0.001)*0.5;

    camera.lookAt(player.position);

    // ======================
    // ORBS INTERACTION (sila + absorbcia)
    // ======================
    for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];

        const dx = player.position.x - o.position.x;
        const dy = player.position.y - o.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // orb reaguje na tvoju silu
        if(dist < 5){
            o.position.x += dx * 0.02;
            o.position.y += dy * 0.02;
        }

        // absorbcia (nie “pickup”, ale “zjednotenie”)
        if(dist < 0.8){
            scene.remove(o);
            orbs.splice(i,1);

            biomass++;

            // vizuálny pulse
            player.classList && player.classList.add("pulse");

            player.scale.multiplyScalar(1.015);

            spawnOrb();
        }
    }

    // UI
    bio.innerText = biomass;
    bar.style.width = Math.min(biomass*1.5,100) + "%";

    renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
