<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeno Evolution SAFE v1</title>

<style>
body { margin:0; overflow:hidden; background:#020617; }
#ui {
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-family:system-ui;
    z-index:10;
}
.bar {
    width:200px;
    height:10px;
    background:#1f2937;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}
.fill {
    height:100%;
    width:0%;
    background:#22c55e;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="ui">
🧬 Biomasa: <span id="bio">0</span>
<div class="bar"><div id="bar" class="fill"></div></div>
</div>

<script>

// SCÉNA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020617);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 10;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// HRÁČ (jednoduchý materiál = stabilita)
const player = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 16),
    new THREE.MeshBasicMaterial({ color:0x38bdf8 })
);
scene.add(player);

// INPUT
let target = {x:0,y:0};

window.addEventListener("touchmove",(e)=>{
    const t = e.touches[0];
    target.x = (t.clientX/window.innerWidth)*8-4;
    target.y = -(t.clientY/window.innerHeight)*5+2;
});

window.addEventListener("mousemove",(e)=>{
    target.x = (e.clientX/window.innerWidth)*8-4;
    target.y = -(e.clientY/window.innerHeight)*5+2;
});

// ORBS
const orbs = [];

function spawnOrb(){
    const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.2,8,8),
        new THREE.MeshBasicMaterial({ color:0x22c55e })
    );

    orb.position.x = (Math.random()-0.5)*20;
    orb.position.y = (Math.random()-0.5)*15;
    orb.position.z = 0;

    scene.add(orb);
    orbs.push(orb);
}

for(let i=0;i<40;i++) spawnOrb();

// GAME
let biomass = 0;

const bio = document.getElementById("bio");
const bar = document.getElementById("bar");

function animate(){
    requestAnimationFrame(animate);

    // pohyb
    player.position.x += (target.x - player.position.x) * 0.1;
    player.position.y += (target.y - player.position.y) * 0.1;

    // zber (2D PRESNE)
    for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];

        const dx = player.position.x - o.position.x;
        const dy = player.position.y - o.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 1){
            scene.remove(o);
            orbs.splice(i,1);

            biomass++;
            player.scale.multiplyScalar(1.03);

            spawnOrb();
        }
    }

    bio.innerText = biomass;
    bar.style.width = Math.min(biomass*2,100) + "%";

    renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
